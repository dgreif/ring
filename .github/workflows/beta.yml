name: Manage beta

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Start or exit beta mode
        required: true
        type: choice
        options:
          - Start beta
          - Exit beta

concurrency:
  group: Release-refs/heads/main
  cancel-in-progress: false

permissions: {}

jobs:
  beta:
    name: Create beta management pull request
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Confirm this runs from main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from main."
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate beta transition
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from 'node:fs'

          const path = '.changeset/pre.json'
          const hasPre = existsSync(path)
          const pre = hasPre ? JSON.parse(readFileSync(path, 'utf8')) : undefined
          if (process.env.OPERATION === 'Start beta') {
            if (hasPre) throw new Error('Cannot start beta while a prerelease cycle exists.')
            for (const path of ['packages/ring-client-api/package.json', 'packages/homebridge-ring/package.json']) {
              const { name, version } = JSON.parse(readFileSync(path, 'utf8'))
              if (version.includes('-')) throw new Error(`Cannot start beta from ${name}@${version}.`)
            }
          } else if (process.env.OPERATION === 'Exit beta') {
            if (pre?.mode !== 'pre' || pre.tag !== 'beta') {
              throw new Error('Cannot exit beta without an active beta cycle.')
            }
          } else {
            throw new Error('Unknown beta operation.')
          }
          NODE

      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_CHANGESETS }}
          OPERATION: ${{ inputs.operation }}
        run: |
          if [ "$OPERATION" = "Start beta" ]; then
            pnpm exec changeset pre enter beta
            title="Start beta release cycle"
            body="Enter Changesets beta mode on main. Merging this pull request does not publish a release."
            operation=start
          else
            pnpm exec changeset pre exit
            title="Exit beta release cycle"
            body="Exit Changesets beta mode on main. Merging this pull request does not publish a release; review and merge the subsequent version pull request to publish the stable release."
            operation=exit
          fi
          branch="manage-beta/$operation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add .changeset/pre.json
          git commit -m "$title"
          gh auth setup-git
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "$title" --body "$body"
